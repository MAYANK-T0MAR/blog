on:
  push:
    paths:
      - "posts/*/meta.yml"
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Rebuild index.json
        run: npm run build-index

      - name: Commit updated index
        run: |
          git config user.name "github-actions"
          git add index.json
          git commit -m "chore: update index.json" || exit 0
          git push

      - name: Purge jsDelivr cache
        run: |
          curl -X GET "https://purge.jsdelivr.net/gh/MAYANK-T0MAR/blog@main/index.json"
